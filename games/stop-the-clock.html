<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stop the Clock – CSHS</title>
<style>
  @import url('../assets/fonts/fonts.css');
  :root {
    --green: #00180f; --green-mid: #003d1f; --green-light: #005a2e;
    --gold: #f2b400; --gold-dim: rgba(242,180,0,0.15); --gold-border: rgba(242,180,0,0.3);
    --white: #fdfdfd; --muted: rgba(255,255,255,0.55); --danger: #e05252; --correct: #4caf7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--green); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }

  .header { text-align: center; margin-bottom: 24px; }
  .header-eyebrow { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.4rem,8vw,3.8rem); letter-spacing: 0.06em; color: var(--white); line-height: 1; }
  .header h1 span { color: var(--gold); }
  .header-sub { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; margin-bottom: 16px; width: 100%; max-width: 480px; }
  .card-title { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }

  /* Player banner */
  .player-banner { display: flex; align-items: center; gap: 12px; background: var(--gold-dim); border: 1px solid var(--gold-border); border-radius: 10px; padding: 12px 16px; margin-bottom: 20px; }
  .player-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
  .player-name-input { flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--gold-border); color: var(--gold); font-family: 'DM Sans', sans-serif; font-size: 1.1rem; font-weight: 700; padding: 4px 6px; outline: none; }
  .player-name-input::placeholder { color: rgba(242,180,0,0.3); }
  .player-name-input:disabled { border-color: rgba(255,255,255,0.15); color: var(--white); }

  /* Target + Timer */
  .target-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); text-align: center; margin-bottom: 6px; }
  .target-val { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem,8vw,3rem); text-align: center; color: var(--gold); letter-spacing: 0.05em; margin-bottom: 20px; }
  .timer-display { font-family: 'Bebas Neue', sans-serif; font-size: clamp(4rem,18vw,6.5rem); text-align: center; color: var(--white); letter-spacing: 0.02em; margin-bottom: 24px; line-height: 1; transition: color 0.1s; }
  .timer-display.running { color: var(--gold); }
  .timer-display.stopped { color: var(--danger); }

  /* Attempt dots */
  .attempts { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); transition: all 0.2s; }
  .dot.used { background: var(--gold-dim); border-color: var(--gold); }
  .dot.best { background: var(--gold); border-color: var(--gold); }

  /* Attempt log */
  .attempt-log { margin-bottom: 16px; }
  .attempt-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); margin-bottom: 5px; font-size: 13px; }
  .attempt-row .aname { font-weight: 700; color: var(--white); }
  .attempt-row .atime { font-family: 'DM Mono', monospace; color: var(--muted); font-size: 12px; }
  .attempt-row.best-row { border-color: var(--gold-border); background: var(--gold-dim); }
  .attempt-row.best-row .aname { color: var(--gold); }

  /* Result */
  .result-panel { display: none; background: var(--gold-dim); border: 1px solid var(--gold-border); border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; text-align: center; }
  .result-panel.show { display: block; }
  .result-score { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--gold); letter-spacing: 0.05em; }
  .result-off { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: all 0.15s; letter-spacing: 0.02em; width: 100%; margin-bottom: 10px; }
  .btn-primary { background: var(--gold); color: var(--green); }
  .btn-primary:hover { background: #ffc820; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(242,180,0,0.3); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-stop { background: var(--danger); color: var(--white); animation: pulseRed 0.8s ease-in-out infinite; }
  @keyframes pulseRed { 0%,100%{box-shadow:0 0 0 0 rgba(224,82,82,0.4);}50%{box-shadow:0 0 0 10px rgba(224,82,82,0);} }
  .btn-outline { background: transparent; color: var(--gold); border: 1px solid var(--gold-border); }
  .btn-outline:hover { background: var(--gold-dim); }

  /* Form */
  .form-section { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px; }
  .form-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 8px; margin-top: 14px; }
  .group-select { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .group-btn { background: var(--gold-dim); border: 1px solid var(--gold-border); color: var(--white); padding: 8px 6px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center; }
  .group-btn:hover { background: rgba(242,180,0,0.28); border-color: var(--gold); }
  .group-btn.selected { background: var(--gold); color: var(--green); border-color: var(--gold); }
</style>
</head>
<body>
<div class="header">
  <div class="header-eyebrow">Corinda State High School</div>
  <h1>Stop the <span>Clock</span></h1>
  <div class="header-sub">3 players — closest to 5 seconds wins</div>
</div>

<div class="card" style="max-width:480px;width:100%">
  <div class="player-banner" id="playerBanner">
    <span class="player-label">Player up</span>
    <input class="player-name-input" id="playerNameInput" type="text" aria-label="Student name" placeholder="Enter student name…" maxlength="30">
  </div>

  <div class="target-label">Target Time</div>
  <div class="target-val">5.000s</div>

  <div class="attempts" id="attemptDots">
    <div class="dot" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
  </div>

  <div class="timer-display" id="timerDisplay">0.000</div>
  <div class="attempt-log" id="attemptLog" style="display:none"></div>

  <div class="result-panel" id="resultPanel">
    <div class="result-score" id="resultScore"></div>
    <div class="result-off" id="resultOff"></div>
  </div>

  <button class="btn btn-primary" id="mainBtn" onclick="handleBtn()">Start</button>
  <button class="btn btn-outline" onclick="resetAll()">Reset</button>

  <div class="form-section" id="formSection" style="display:none">
    <span class="form-label">House</span>
    <div class="group-select" id="houseSelectBtns"></div>
    <span class="form-label">Home Group</span>
    <div class="group-select" id="groupSelectBtns"></div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitScore()" style="margin-top:16px" disabled>📤 Submit Score</button>
  </div>
</div>

<script src="../assets/site-config.js"></script>
<script>
// Opens the score form. Returns false if the browser blocked the new tab, in
// which case a real link is shown instead — clicking a link is never blocked.
function cshsSubmitButton(){
  return document.getElementById('submitScoreBtn')||document.getElementById('submitBtn')||
         document.querySelector('#score-form button');
}
// Teaching week 1-40, derived from the shared term dates.
function cshsAbsWeek(){
  try{
    var terms=window.CSHS_SITE_CONFIG.terms;
    var pd=function(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);};
    var monday=function(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x;};
    var today=new Date(); today.setHours(0,0,0,0);
    var abs=0, current=0;
    for(var i=0;i<terms.length;i++){
      var end=pd(terms[i].end), m=monday(pd(terms[i].start));
      while(m<=end){ abs++; if(m<=today){ current=abs; } m=new Date(m); m.setDate(m.getDate()+7); }
    }
    return current;
  }catch(e){ return 0; }
}
function cshsWeekStrength(){
  try{
    var list=window.CSHS_SITE_CONFIG.strengths, n=cshsAbsWeek();
    return (n && list && list[n-1]) ? list[n-1] : '';
  }catch(e){ return ''; }
}
function cshsLeaderboardHref(){
  var p=location.pathname;
  return p.replace(/[^\/]*$/, 'leaderboard'+(/\.aspx$/i.test(p)?'.aspx':'.html'));
}
// Added next to the submit button, so it appears and hides with the result panel.
function cshsResultExtras(showStrength){
  var btn=cshsSubmitButton();
  if(!btn||!btn.parentNode||document.getElementById('cshsResultExtras')){ return; }
  var box=document.createElement('div');
  box.id='cshsResultExtras';
  box.style.cssText='margin-top:10px;text-align:center;line-height:1.6;';
  if(showStrength){
    var st=cshsWeekStrength();
    if(st){
      var p=document.createElement('p');
      p.style.cssText='margin:0 0 6px;font-size:13px;opacity:.85;';
      p.textContent="This week's character strength: "+st;
      box.appendChild(p);
    }
  }
  var a=document.createElement('a');
  // Same tab on purpose: a new tab does not inherit the staff access key, so
  // the gated leaderboard would ask for it again. It also avoids leaving stray
  // tabs open on a classroom projector.
  a.href=cshsLeaderboardHref();
  a.textContent='See where your house is sitting \u2192';
  a.style.cssText='display:inline-block;font-size:13px;font-weight:700;color:#f2b400;text-decoration:underline;';
  box.appendChild(a);
  btn.parentNode.insertBefore(box, btn.nextSibling);
}
// Short confetti burst over the result panel. Skipped when the viewer has
// asked for reduced motion.
function cshsCelebrate(host){
  try{
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ return; }
    if(!document.getElementById('cshs-celebrate-style')){
      var st=document.createElement('style'); st.id='cshs-celebrate-style';
      st.textContent='@keyframes cshsFall{0%{opacity:0;transform:translateY(-10px) rotate(0)}'+
        '12%{opacity:1}100%{opacity:0;transform:translateY(300px) rotate(540deg)}}';
      document.head.appendChild(st);
    }
    var btn=cshsSubmitButton();
    host = host || (btn && btn.parentNode);
    if(!host){ return; }
    if(getComputedStyle(host).position==='static'){ host.style.position='relative'; }
    var colours=['#f2b400','#4caf7a','#fdfdfd','#5bc0de','#e07a5f'];
    var wrap=document.createElement('div');
    wrap.style.cssText='position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;'+
      'pointer-events:none;z-index:5;';
    for(var i=0;i<22;i++){
      var bit=document.createElement('i');
      bit.style.cssText='position:absolute;top:0;left:'+(Math.random()*100).toFixed(1)+'%;'+
        'width:8px;height:12px;opacity:0;background:'+colours[i%colours.length]+';border-radius:2px;'+
        'animation:cshsFall '+(900+Math.random()*700).toFixed(0)+'ms ease-in '+
        (Math.random()*260).toFixed(0)+'ms forwards;';
      wrap.appendChild(bit);
    }
    host.appendChild(wrap);
    setTimeout(function(){ if(wrap.parentNode){ wrap.parentNode.removeChild(wrap); } },2400);
  }catch(e){}
}
(function(){
  var go=function(){ cshsResultExtras(true); };
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',go,{once:true}); }
  else { go(); }
})();
function cshsOpenForm(url){
  // URLSearchParams encodes spaces as "+", which Microsoft Forms stores
  // literally ("Moori+G"). A real plus is encoded as %2B, so every bare "+"
  // here is a space.
  url = String(url).replace(/\+/g, '%20');
  var w=null;
  try{ w=window.open(url,'_blank'); }catch(e){ w=null; }
  var box=document.getElementById('cshsFormFallback');
  if(w){
    if(box){ box.style.display='none'; }
    // The form is open, so this attempt is done. Runs after the caller's own
    // button messaging so it is not overwritten.
    // Captured now, before the caller relabels the button.
    var btn0=cshsSubmitButton();
    var was=btn0?{text:btn0.textContent, disabled:btn0.disabled, animation:btn0.style.animation,
                  opacity:btn0.style.opacity, cursor:btn0.style.cursor}:null;
    setTimeout(function(){
      var btn=cshsSubmitButton();
      if(!btn||!was){ return; }
      btn.disabled=true;
      btn.textContent='\u2713 Score sent \u2014 press Submit in the form tab';
      btn.style.animation='none';
      btn.style.opacity='0.6';
      btn.style.cursor='default';
      // Games hide the result panel between rounds, so treat the button being
      // hidden as the start of a new attempt and give it back.
      var watch=setInterval(function(){
        if(!document.body.contains(btn)){ clearInterval(watch); return; }
        if(btn.offsetParent===null){
          btn.disabled=was.disabled;
          btn.textContent=was.text;
          btn.style.animation=was.animation;
          btn.style.opacity=was.opacity;
          btn.style.cursor=was.cursor;
          clearInterval(watch);
        }
      },300);
    },0);
    return true;
  }
  // Runs after the caller's own "submitted" messaging, so it can correct it.
  setTimeout(function(){
    var confirmEl=document.getElementById('submitConfirm');
    if(confirmEl){ confirmEl.style.display='none'; }
    var b=document.getElementById('cshsFormFallback');
    if(!b){
      b=document.createElement('div');
      b.id='cshsFormFallback';
      b.setAttribute('role','alert');
      b.style.cssText='margin:12px 0;padding:12px 14px;border:1px solid rgba(242,180,0,.5);'+
        'border-radius:10px;background:rgba(242,180,0,.12);text-align:center;';
      var msg=document.createElement('div');
      msg.style.cssText='font-size:13px;line-height:1.5;color:#fdfdfd;margin-bottom:9px;';
      msg.textContent='Your browser blocked the new tab, so the score form did not open. '+
        'Use this link instead — your score is already filled in.';
      var a=document.createElement('a');
      a.id='cshsFormFallbackLink';
      a.target='_blank'; a.rel='noopener';
      a.textContent='Open the score form';
      a.style.cssText='display:inline-block;padding:9px 18px;border-radius:8px;background:#f2b400;'+
        'color:#00180f;font-weight:700;font-size:14px;text-decoration:none;';
      b.appendChild(msg); b.appendChild(a);
      var anchor=cshsSubmitButton();
      if(anchor&&anchor.parentNode){ anchor.parentNode.insertBefore(b,anchor.nextSibling); }
      else{ document.body.appendChild(b); }
    }
    document.getElementById('cshsFormFallbackLink').href=url;
    b.style.display='';
    try{ b.scrollIntoView({block:'nearest'}); }catch(e){}
  },0);
  return false;
}

  const HOUSES = ['Bunar','Dibbil','Kabul','Moori','Pirri','Yarraman'];
  const GROUPS = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','Staff'];
  const MAX_ATTEMPTS = 3, TARGET = 5.000;

  let running=false, startTime=null, animFrame=null, stopped=false, attempt=0, scores=[];
  let selectedHouse=null, selectedGroup=null;

  const timerEl    = document.getElementById('timerDisplay');
  const btnEl      = document.getElementById('mainBtn');
  const resultPanel= document.getElementById('resultPanel');
  const resultScore= document.getElementById('resultScore');
  const resultOff  = document.getElementById('resultOff');
  const formSection= document.getElementById('formSection');
  const submitBtn  = document.getElementById('submitBtn');
  const attemptLog = document.getElementById('attemptLog');
  const playerInput= document.getElementById('playerNameInput');

  function fmt(s){ return s.toFixed(3); }

  function tick(){
    if(!running) return;
    timerEl.textContent = fmt((performance.now()-startTime)/1000);
    animFrame = requestAnimationFrame(tick);
  }

  function handleBtn(){
    if(!running && !stopped){
      if(!playerInput.value.trim()){ playerInput.focus(); playerInput.style.borderColor='var(--danger)'; return; }
      playerInput.style.borderColor='';
      playerInput.disabled=true;
      startTime=performance.now(); running=true;
      timerEl.className='timer-display running';
      btnEl.textContent='STOP!'; btnEl.className='btn btn-stop';
      resultPanel.classList.remove('show');
      animFrame=requestAnimationFrame(tick);
    } else if(running){
      cancelAnimationFrame(animFrame);
      const elapsed=(performance.now()-startTime)/1000;
      running=false; stopped=true;
      timerEl.textContent=fmt(elapsed);
      timerEl.className='timer-display stopped';
      btnEl.className='btn btn-primary';

      const diff=Math.abs(elapsed-TARGET);
      const rawScore=Math.max(0,1000-diff*1000);
      scores.push({elapsed,diff,rawScore,name:playerInput.value.trim()});
      document.getElementById('d'+attempt).classList.add('used');
      updateLog();

      resultPanel.classList.add('show');
      resultScore.textContent='Off by '+fmt(diff)+'s';
      resultOff.textContent= attempt+1 < MAX_ATTEMPTS ? 'Next player up!' : '';

      attempt++;
      if(attempt>=MAX_ATTEMPTS){
        btnEl.style.display='none';
        showBestAndForm();
      } else {
        stopped=false;
        btnEl.textContent='Next Player — Start';
        playerInput.value=''; playerInput.disabled=false; playerInput.focus();
      }
    }
  }

  function updateLog(){
    attemptLog.style.display='block';
    attemptLog.innerHTML=scores.map((s,i)=>
      `<div class="attempt-row" id="logrow${i}">
        <span class="aname">${s.name}</span>
        <span class="atime">${fmt(s.elapsed)}s &nbsp;·&nbsp; off ${fmt(s.diff)}s</span>
      </div>`
    ).join('');
  }

  function showBestAndForm(){
    const best=scores.reduce((a,b)=>a.rawScore>b.rawScore?a:b);
    const bi=scores.indexOf(best);
    document.getElementById('d'+bi).classList.replace('used','best');
    const row=document.getElementById('logrow'+bi);
    if(row) row.classList.add('best-row');
    const finalScore=Math.round(best.rawScore/100);
    resultScore.textContent='🏆 '+best.name+' wins!';
    resultOff.textContent=fmt(best.elapsed)+'s — Score: '+finalScore+' / 10';
    playerInput.disabled=true;
    document.getElementById('playerBanner').style.opacity='0.5';
    formSection.style.display='block';
    buildSelectors();
    setTimeout(function(){cshsCelebrate(formSection);},60);
  }

  function buildSelectors(){
    const hd=document.getElementById('houseSelectBtns');
    const gd=document.getElementById('groupSelectBtns');
    hd.innerHTML=HOUSES.map(h=>`<button class="group-btn" onclick="selectHouse('${h}')">${h}</button>`).join('');
    gd.innerHTML=GROUPS.map(g=>`<button class="group-btn" onclick="selectGroup('${g}')">${g}</button>`).join('');
  }
  function selectHouse(h){ selectedHouse=h; selectedGroup=null; document.querySelectorAll('#houseSelectBtns .group-btn').forEach(b=>b.classList.toggle('selected',b.textContent===h)); document.querySelectorAll('#groupSelectBtns .group-btn').forEach(b=>b.classList.remove('selected')); checkForm(); }
  function selectGroup(g){ selectedGroup=g; document.querySelectorAll('#groupSelectBtns .group-btn').forEach(b=>b.classList.toggle('selected',b.textContent===g)); checkForm(); }
  function checkForm(){ submitBtn.disabled=!(selectedHouse&&selectedGroup); }

  function getCurrentWeek(){
    const terms = window.CSHS_SITE_CONFIG.terms;
    const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
    const mondayOf=d=>{const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x;};
    const today=new Date(); today.setHours(0,0,0,0);
    let chosen={t:1,w:1};
    for(const term of terms){
      const end=parse(term.end); let mon=mondayOf(parse(term.start)); let w=1;
      while(mon<=end){
        if(mon<=today) chosen={t:term.t,w}; else return `Term ${chosen.t} · Week ${chosen.w}`;
        mon=new Date(mon); mon.setDate(mon.getDate()+7); w++;
      }
    }
    return `Term ${chosen.t} · Week ${chosen.w}`;
  }
  const CSHS_FORM_BASE='https://forms.cloud.microsoft/Pages/ResponsePage.aspx';
  const CSHS_FORM_ID='xccAZrUWr0uekzI72MAduqpmcw_jVYVCjN05AfEP1IdUOUtFVUJQOFhZWjRZNjAzRkMyWlozTUpTUy4u';
  const CSHS_F_WEEK='rb28fecc633264af694f45d8cf2b3b8c1',CSHS_F_GAME='rdbbd457b83da425e93f978536b950482';
  const CSHS_F_HOUSE='rd04d4cf9da8a4213820791f91cdcf6ba',CSHS_F_GROUP='r3022db1950b649218496e706728c203f';
  const CSHS_F_SCORE='r8b61653d0854482a9e7e329026083f7b';

  function submitScore(){
    const best=scores.reduce((a,b)=>a.rawScore>b.rawScore?a:b);
    const finalScore=Math.round(best.rawScore/100);
    const params=new URLSearchParams({id:CSHS_FORM_ID,[CSHS_F_WEEK]:getCurrentWeek(),[CSHS_F_GAME]:'Stop the Clock',[CSHS_F_HOUSE]:selectedHouse,[CSHS_F_GROUP]:(selectedGroup==='Staff'?'Staff':selectedHouse+' '+selectedGroup),[CSHS_F_SCORE]:String(finalScore)});
    cshsOpenForm(CSHS_FORM_BASE+'?'+params.toString());
    submitBtn.textContent='↗ Reopen form'; submitBtn.disabled=false;
  }

  function resetAll(){
    cancelAnimationFrame(animFrame);
    running=false;stopped=false;attempt=0;scores=[];selectedHouse=null;selectedGroup=null;
    timerEl.textContent='0.000';timerEl.className='timer-display';
    btnEl.textContent='Start';btnEl.className='btn btn-primary';btnEl.style.display='';
    resultPanel.classList.remove('show');
    attemptLog.style.display='none';attemptLog.innerHTML='';
    formSection.style.display='none';
    submitBtn.textContent='📤 Submit Score';submitBtn.disabled=true;
    document.getElementById('playerBanner').style.opacity='';
    playerInput.value='';playerInput.disabled=false;playerInput.style.borderColor='';
    ['d0','d1','d2'].forEach(id=>{document.getElementById(id).className='dot';});
  }
</script>
