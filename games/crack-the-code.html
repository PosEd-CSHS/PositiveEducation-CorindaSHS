<html lang="en">
<head>
<meta charset="UTF-8">

<title>Crack the Code – CSHS</title>
<style>
  @import url('../assets/fonts/fonts.css');
  :root{
    --green:#00180f;--green-mid:#003d1f;--green-light:#005a2e;
    --gold:#f2b400;--gold-dim:rgba(242,180,0,0.15);--gold-border:rgba(242,180,0,0.3);
    --white:#fdfdfd;--muted:rgba(255,255,255,0.68);--danger:#e05252;--correct:#4caf7a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--green);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
  .header{text-align:center;margin-bottom:20px;}
  .header-eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .header h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(2.5rem,9vw,4.2rem);letter-spacing:.06em;color:var(--white);line-height:.95;}
  .header h1 span{color:var(--gold);}
  .header-sub{font-size:13px;color:var(--muted);margin-top:8px;max-width:520px;}
  .card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;margin-bottom:16px;width:100%;max-width:560px;}
  .week-tag{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:16px;}
  .form-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:8px;margin-top:14px;}
  .group-select{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:8px;}
  .group-btn{background:var(--gold-dim);border:1px solid var(--gold-border);color:var(--white);padding:8px 6px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;}
  .group-btn:hover{background:rgba(242,180,0,0.28);border-color:var(--gold);}
  .group-btn.selected{background:var(--gold);color:var(--green);border-color:var(--gold);}
  .group-btn[disabled]{opacity:.4;cursor:not-allowed;}
  .focus-hint{background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:10px;padding:12px 16px;margin-bottom:16px;text-align:center;}
  .focus-hint .fh-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
  .focus-hint .fh-strength{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;color:var(--gold);letter-spacing:.04em;line-height:1.1;margin-top:2px;}
  .focus-hint .fh-virtue{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px;}

  .clue-wrap{background:#fdfdfd;color:#00180f;border:3px solid var(--gold);border-radius:16px;min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;margin-bottom:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;}
  .code-clue{width:100%;max-width:480px;display:flex;align-items:center;justify-content:center;gap:.35em;flex-wrap:wrap;font-family:'DM Mono','Arial Black',system-ui,sans-serif;font-weight:800;line-height:1.1;font-size:clamp(2.1rem,11vw,4.8rem);letter-spacing:.02em;}
  .code-clue .small{font-size:.62em;}
  .code-clue .medium{font-size:.8em;}
  .code-clue .big{font-size:1.25em;}
  .code-clue .huge{font-size:1.55em;}
  .code-clue .word{display:inline-block;font-weight:900;}
  .code-clue .stack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em;}
  .code-clue .row{display:flex;align-items:center;justify-content:center;gap:.25em;flex-wrap:wrap;}
  .code-clue .box{border:4px solid #00180f;border-radius:12px;padding:.15em .25em;display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;min-height:1.2em;}
  .code-clue .outside{transform:translateX(-.2em);}
  .code-clue .line{display:inline-block;width:min(36vw,210px);height:6px;background:#00180f;border-radius:6px;vertical-align:middle;}
  .code-clue .tunnel{letter-spacing:-.2em;}
  .code-clue .red{color:#d7263d;}.code-clue .blue{color:#1d4ed8;}.code-clue .greenText{color:#078a44;}
  .answer-input{width:100%;background:var(--green-mid);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:1.05rem;font-weight:700;padding:13px 14px;outline:none;text-align:center;margin-bottom:14px;}
  .answer-input:focus{border-color:var(--gold-border);box-shadow:0 0 14px rgba(242,180,0,0.12);}
  .answer-input::placeholder{color:rgba(255,255,255,0.34);font-weight:400;}
  .answer-input:disabled{opacity:.6;}
  .feedback{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.04em;text-align:center;margin-bottom:14px;min-height:1.4em;}
  .hint-box{background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:10px;padding:10px 14px;margin-bottom:14px;text-align:center;}
  .hint-box .hint-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
  .hint-box .hint-pattern{margin-top:5px;line-height:1.7;}
  .hint-box .hint-word{display:inline-block;margin:0 .5em;font-family:'DM Mono',monospace;font-size:1.15rem;letter-spacing:.22em;color:var(--gold);}
  .hint-box .hint-note{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:4px;}
  .feedback.try{color:var(--gold);}.feedback.right{color:var(--correct);}.feedback.wrong{color:var(--danger);}
  .reveal-panel{display:none;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:10px;padding:16px 18px;margin-bottom:16px;text-align:center;}
  .reveal-panel.show{display:block;}
  .reveal-answer{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--gold);letter-spacing:.04em;line-height:1.1;}
  .reveal-score{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--white);letter-spacing:.04em;margin-top:6px;}
  .reveal-link{font-size:12.5px;color:var(--white);opacity:.9;margin-top:10px;line-height:1.5;}.reveal-link b{color:var(--gold);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:800;cursor:pointer;border:none;transition:all .15s;letter-spacing:.02em;width:100%;margin-bottom:10px;}
  .btn-primary{background:var(--gold);color:var(--green);}.btn-primary:hover{background:#ffc820;transform:translateY(-1px);box-shadow:0 4px 16px rgba(242,180,0,0.3);}.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold-border);}.btn-outline:hover{background:var(--gold-dim);}
  .group-btn:focus-visible,.btn:focus-visible,.answer-input:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .lock-notice{display:none;background:rgba(224,82,82,0.12);border:1px solid rgba(224,82,82,0.35);border-radius:10px;padding:12px 16px;margin-bottom:12px;font-size:12px;color:#ffb3b3;text-align:center;font-family:'DM Mono',monospace;line-height:1.5;}
  .lock-notice.show{display:block;}.warn-line{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px;font-family:'DM Mono',monospace;}
  @media (max-width:460px){body{padding:14px 10px}.card{padding:16px}.clue-wrap{min-height:145px;padding:12px}.code-clue{font-size:clamp(1.75rem,13vw,3.6rem)}.group-select{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:7px}.group-btn{font-size:12px}}
</style>

</div>

// Opens the score form. Returns false if the browser blocked the new tab, in
// which case a real link is shown instead — clicking a link is never blocked.
function cshsOpenForm(url){
  // URLSearchParams encodes spaces as "+", which Microsoft Forms stores
  // literally ("Moori+G"). A real plus is encoded as %2B, so every bare "+"
  // here is a space.
  url = String(url).replace(/\+/g, '%20');
  var w=null;
  try{ w=window.open(url,'_blank'); }catch(e){ w=null; }
  var box=document.getElementById('cshsFormFallback');
  if(w){ if(box){ box.style.display='none'; } return true; }
  // Runs after the caller's own "submitted" messaging, so it can correct it.
  setTimeout(function(){
    var confirmEl=document.getElementById('submitConfirm');
    if(confirmEl){ confirmEl.style.display='none'; }
    var b=document.getElementById('cshsFormFallback');
    if(!b){
      b=document.createElement('div');
      b.id='cshsFormFallback';
      b.setAttribute('role','alert');
      b.style.cssText='margin:12px 0;padding:12px 14px;border:1px solid rgba(242,180,0,.5);'+
        'border-radius:10px;background:rgba(242,180,0,.12);text-align:center;';
      var msg=document.createElement('div');
      msg.style.cssText='font-size:13px;line-height:1.5;color:#fdfdfd;margin-bottom:9px;';
      msg.textContent='Your browser blocked the new tab, so the score form did not open. '+
        'Use this link instead — your score is already filled in.';
      var a=document.createElement('a');
      a.id='cshsFormFallbackLink';
      a.target='_blank'; a.rel='noopener';
      a.textContent='Open the score form';
      a.style.cssText='display:inline-block;padding:9px 18px;border-radius:8px;background:#f2b400;'+
        'color:#00180f;font-weight:700;font-size:14px;text-decoration:none;';
      b.appendChild(msg); b.appendChild(a);
      var anchor=document.getElementById('submitScoreBtn')||document.getElementById('submitBtn')||
                 document.querySelector('#score-form button');
      if(anchor&&anchor.parentNode){ anchor.parentNode.insertBefore(b,anchor.nextSibling); }
      else{ document.body.appendChild(b); }
    }
    document.getElementById('cshsFormFallbackLink').href=url;
    b.style.display='';
    try{ b.scrollIntoView({block:'nearest'}); }catch(e){}
  },0);
  return false;
}

  const CSHS_TERMS = window.CSHS_SITE_CONFIG.terms;
  function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
  function mondayOf(d){const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x}
  function cshsWeekInfo(){const today=new Date();today.setHours(0,0,0,0);let chosen={t:1,w:1},abs=0,chosenAbs=0;for(const term of CSHS_TERMS){const end=parseISO(term.end);let mon=mondayOf(parseISO(term.start));let w=1;while(mon<=end){abs++;if(mon<=today){chosen={t:term.t,w};chosenAbs=abs}mon=new Date(mon);mon.setDate(mon.getDate()+7);w++}}return {label:`Term ${chosen.t} · Week ${chosen.w}`,abs:chosenAbs||1,t:chosen.t,w:chosen.w}}
  function cshsWeekLabel(){return cshsWeekInfo().label}
  const WEEK_PLAN={
    '1-1':{p:'welcomeBack'},'1-2':{p:'posEdIntro'},'1-3':{p:'permahOverview'},'1-4':{p:'virtuesOverview'},
    '1-5':{p:'humanityIntro'},'1-6':{s:'love'},'1-7':{s:'social'},'1-8':{s:'kindness'},
    '1-9':{p:'transcendIntro'},'1-10':{s:'humour'},
    '2-1':{s:'spirituality'},'2-2':{s:'appreciation'},'2-3':{s:'hope'},'2-4':{s:'gratitude'},
    '2-5':{p:'wisdomIntro'},'2-6':{s:'learning'},'2-7':{s:'perspective'},'2-8':{s:'curiosity'},'2-9':{s:'creativity'},'2-10':{s:'judgement'},
    '3-1':{p:'virtuesRecap'},'3-2':{p:'permahRecap'},'3-3':{p:'justiceIntro'},'3-4':{s:'leadership'},'3-5':{s:'fairness'},'3-6':{s:'teamwork'},
    '3-7':{p:'courageIntro'},'3-8':{s:'zest'},'3-9':{s:'bravery'},'3-10':{s:'perseverance'},'4-1':{s:'honesty'},'4-2':{p:'courageReview'},
    '4-3':{p:'temperanceIntro'},'4-4':{s:'prudence'},'4-5':{s:'humility'},'4-6':{s:'regulation'},'4-7':{s:'forgiveness'},'4-8':{p:'yearReview'}
  };
  function planForThisWeek(){const info=cshsWeekInfo();const cell=WEEK_PLAN[info.t+'-'+info.w];if(cell&&cell.s){const st=STRENGTHS.find(x=>x.id===cell.s),pz=PUZZLES[cell.s];return {puzzle:pz,title:st.name,sub:st.virtue+' · '+(LEARNER_VALUE[st.virtue]||''),label:"This week's focus",linkHtml:`<b>${st.name}</b> link — ${pz.link}.`}}const key=(cell&&cell.p)||'_default',pz=PUZZLES[key]||PUZZLES._default,lab=LABELS[key]||['This week','Crack the Code'];return {puzzle:pz,title:lab[0],sub:lab[1],label:"This week's focus",linkHtml:`<b>${lab[0]}</b> — ${pz.link}.`}}

  const HOUSES=['Bunar','Dibbil','Kabul','Moori','Pirri','Yarraman'];const GROUPS=['A','B','C','D','E','F','G','H','I','J','K','L','M','N','Staff'];
  const GUESS_SCORES=[10,7,4];let selectedHouse=null,selectedGroup=null,attempt=0,finalScore=0,puzzle=null,current=null;
  const weekTag=document.getElementById('weekTag'),entryView=document.getElementById('entryView'),playView=document.getElementById('playView'),resultView=document.getElementById('resultView'),lockNotice=document.getElementById('lockNotice'),revealPuzzleBtn=document.getElementById('revealPuzzleBtn'),fhStrength=document.getElementById('fhStrength'),fhVirtue=document.getElementById('fhVirtue'),fhLabel=document.getElementById('fhLabel'),clueDisplay=document.getElementById('clueDisplay'),answerInput=document.getElementById('answerInput'),feedback=document.getElementById('feedback'),guessBtn=document.getElementById('guessBtn'),revealAnsBtn=document.getElementById('revealAnsBtn'),revealAnswer=document.getElementById('revealAnswer'),revealScore=document.getElementById('revealScore'),revealLink=document.getElementById('revealLink'),submitBtn=document.getElementById('submitBtn');
  function init(){current=planForThisWeek();puzzle=current.puzzle;weekTag.textContent=cshsWeekLabel();document.getElementById('houseSelectBtns').innerHTML=HOUSES.map(h=>`<button class="group-btn" onclick="selectHouse('${h}')">${h}</button>`).join('');document.getElementById('groupSelectBtns').innerHTML=GROUPS.map(g=>`<button class="group-btn" onclick="selectGroup('${g}')" ${selectedHouse?'':'disabled title="Choose a house first"'}>${g}</button>`).join('')}
  function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
  function fullGroupName(){if(!selectedGroup)return '';return selectedGroup==='Staff'?'Staff':((selectedHouse||'')+' '+selectedGroup).trim()}
  function selectHouse(h){selectedHouse=h;selectedGroup=null;document.querySelectorAll('#houseSelectBtns .group-btn').forEach(b=>b.classList.toggle('selected',b.textContent===h));document.querySelectorAll('#groupSelectBtns .group-btn').forEach(b=>{b.disabled=false;b.removeAttribute('title');b.classList.remove('selected');});checkEntry()}
  function selectGroup(g){if(!selectedHouse)return;selectedGroup=g;document.querySelectorAll('#groupSelectBtns .group-btn').forEach(b=>b.classList.toggle('selected',b.textContent===g));checkEntry()}
  function checkEntry(){const full=fullGroupName();if(full&&isPlayed(full)){lockNotice.textContent=full+' has already played Crack the Code on this browser for '+cshsWeekLabel()+'. Choose Staff to practise, or come back next week.';lockNotice.classList.add('show');revealPuzzleBtn.disabled=true;return}lockNotice.classList.remove('show');revealPuzzleBtn.disabled=!(selectedHouse&&selectedGroup)}
  function revealPuzzle(){const full=fullGroupName();if(!full)return;if(isPlayed(full)){checkEntry();return}markPlayedLS(full);hideHint();fhLabel.textContent=current.label;fhStrength.textContent=current.title;fhVirtue.textContent=current.sub;clueDisplay.innerHTML=puzzle.c;attempt=0;feedback.textContent='You get 3 guesses — 10, 7 or 4 points.';feedback.className='feedback';answerInput.value='';answerInput.disabled=false;guessBtn.disabled=false;guessBtn.textContent='Guess';revealAnsBtn.style.display='';entryView.style.display='none';playView.style.display='';answerInput.focus()}
  answerInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!guessBtn.disabled)submitGuess()});
  const hintBox=document.getElementById('hintBox'),hintLabel=document.getElementById('hintLabel'),hintPattern=document.getElementById('hintPattern'),hintNote=document.getElementById('hintNote');
  function hideHint(){hintBox.style.display='none';hintPattern.textContent='';hintNote.textContent='';}
  // Guess 2 shows the shape of the answer; guess 3 also reveals each first letter.
  function showHint(level){
    const words=String(puzzle.s).split(/\s+/).filter(Boolean);
    if(!words.length){return}
    // Each word is its own element so the gaps between words stay visible.
    hintPattern.textContent='';
    words.forEach(function(w){
      const span=document.createElement('span');
      span.className='hint-word';
      span.textContent=w.split('').map(function(ch,i){
        if(!/[A-Za-z]/.test(ch)){return ch}
        return (level>=2&&i===0)?ch.toUpperCase():'_';
      }).join(' ');
      hintPattern.appendChild(span);
    });
    hintLabel.textContent=level>=2?'Hint 2 — first letters':'Hint 1 — how it looks';
    hintNote.textContent=words.length+(words.length===1?' word — ':' words — ')+words.map(function(w){return w.length}).join(', ')+' letters';
    hintBox.style.display='';
  }
  function submitGuess(){const guess=norm(answerInput.value);if(!guess){answerInput.focus();return}const hit=puzzle.a.some(ans=>norm(ans)===guess)||norm(puzzle.s)===guess;if(hit){finalScore=GUESS_SCORES[attempt];feedback.textContent=(attempt===0?'✓ Correct! Full marks.':attempt===1?'✓ Nice — second try.':'✓ Got there on the third try.')+' (+'+finalScore+')';feedback.className='feedback right';finish(true)}else if(attempt<GUESS_SCORES.length-1){attempt++;const left=GUESS_SCORES.length-attempt;showHint(attempt);feedback.textContent=left===1?'Not quite — last guess!':'Not quite — '+left+' guesses left.';feedback.className='feedback try';answerInput.select();answerInput.focus()}else{finalScore=0;feedback.textContent='✗ Out of guesses.';feedback.className='feedback wrong';finish(false)}}
  function giveUp(){finalScore=0;finish(false)}
  function finish(solved){answerInput.disabled=true;guessBtn.disabled=true;revealAnsBtn.style.display='none';revealAnswer.textContent=puzzle.s;revealScore.textContent='Score: '+finalScore+' / 10';revealLink.innerHTML=current.linkHtml;playView.style.display='none';resultView.style.display='';submitBtn.focus()}
  const CSHS_FORM_BASE='https://forms.cloud.microsoft/Pages/ResponsePage.aspx',CSHS_FORM_ID='xccAZrUWr0uekzI72MAduqpmcw_jVYVCjN05AfEP1IdUOUtFVUJQOFhZWjRZNjAzRkMyWlozTUpTUy4u',CSHS_F_WEEK='rb28fecc633264af694f45d8cf2b3b8c1',CSHS_F_GAME='rdbbd457b83da425e93f978536b950482',CSHS_F_HOUSE='rd04d4cf9da8a4213820791f91cdcf6ba',CSHS_F_GROUP='r3022db1950b649218496e706728c203f',CSHS_F_SCORE='r8b61653d0854482a9e7e329026083f7b';
  function submitScore(){const full=fullGroupName();const params=new URLSearchParams({id:CSHS_FORM_ID,[CSHS_F_WEEK]:cshsWeekLabel(),[CSHS_F_GAME]:'Crack the Code',[CSHS_F_HOUSE]:selectedHouse,[CSHS_F_GROUP]:full,[CSHS_F_SCORE]:String(finalScore)});cshsOpenForm(CSHS_FORM_BASE+'?'+params.toString());submitBtn.textContent='↗ Reopen form';submitBtn.disabled=false}
  function resetAll(){selectedHouse=null;selectedGroup=null;attempt=0;hideHint();finalScore=0;document.querySelectorAll('.group-btn').forEach(b=>b.classList.remove('selected'));lockNotice.classList.remove('show');revealPuzzleBtn.disabled=true;feedback.textContent='';feedback.className='feedback';answerInput.value='';answerInput.disabled=false;guessBtn.disabled=false;guessBtn.textContent='Guess';revealAnsBtn.style.display='';submitBtn.textContent='📤 Submit Score';submitBtn.disabled=false;resultView.style.display='none';playView.style.display='none';entryView.style.display=''}
  function normaliseGroupName(group){return String(group||'').trim().replace(/\s+/g,' ')}function isStaffGroup(group){const g=normaliseGroupName(group);return g==='Staff'||g.endsWith(' Staff')}function getPlayedKey(){return 'crack:played:'+cshsWeekLabel()}(function(){if(location.search.includes('reset')){try{Object.keys(localStorage).filter(k=>k.startsWith('crack:played:')).forEach(k=>localStorage.removeItem(k))}catch(e){}history.replaceState(null,'',location.pathname)}})();function readPlayedList(){try{const d=JSON.parse(localStorage.getItem(getPlayedKey())||'[]');return Array.isArray(d)?d:[]}catch(e){return []}}function writePlayedList(d){try{localStorage.setItem(getPlayedKey(),JSON.stringify([...new Set(d.map(normaliseGroupName))]))}catch(e){}}function isPlayed(group){const g=normaliseGroupName(group);if(!g||isStaffGroup(g))return false;return readPlayedList().includes(g)}function markPlayedLS(group){const g=normaliseGroupName(group);if(!g||isStaffGroup(g))return;const d=readPlayedList();if(!d.includes(g)){d.push(g);writePlayedList(d)}}
  init();
</script>
