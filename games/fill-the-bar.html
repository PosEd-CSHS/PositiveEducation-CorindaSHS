<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fill the Bar – CSHS</title>
<style>
  @import url('../assets/fonts/fonts.css');
  :root{
    --green:#00180f;--green-mid:#003d1f;--green-light:#005a2e;
    --gold:#f2b400;--gold-dim:rgba(242,180,0,0.15);--gold-border:rgba(242,180,0,0.3);
    --white:#fdfdfd;--muted:rgba(255,255,255,0.55);--danger:#e05252;--correct:#4caf7a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--green);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
  .header{text-align:center;margin-bottom:24px;}
  .header-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.4rem,8vw,3.8rem);letter-spacing:.06em;color:var(--white);line-height:1;}
  .header h1 span{color:var(--gold);}
  .header-sub{font-size:13px;color:var(--muted);margin-top:8px;}
  .card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px;margin-bottom:16px;width:100%;max-width:480px;}

  .player-banner{display:flex;align-items:center;gap:12px;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:10px;padding:12px 16px;margin-bottom:20px;}
  .player-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);white-space:nowrap;}
  .player-name-input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--gold-border);color:var(--gold);font-family:'DM Sans',sans-serif;font-size:1.1rem;font-weight:700;padding:4px 6px;outline:none;}
  .player-name-input::placeholder{color:rgba(242,180,0,0.3);}
  .player-name-input:disabled{border-color:rgba(255,255,255,0.15);color:var(--white);}

  /* Round pips */
  .meta-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .round-badge{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;background:var(--gold-dim);border:1px solid var(--gold-border);color:var(--gold);padding:4px 10px;border-radius:20px;}
  .round-track{display:flex;gap:6px;}
  .rpip{width:24px;height:5px;border-radius:3px;background:rgba(255,255,255,0.1);transition:all .2s;}
  .rpip.done{background:var(--gold);}

  /* Target */
  .target-area{text-align:center;margin-bottom:20px;}
  .target-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .target-pct{font-family:'Bebas Neue',sans-serif;font-size:clamp(4rem,18vw,7rem);color:var(--gold);line-height:1;text-shadow:0 0 40px rgba(242,180,0,0.2);}

  /* Countdown */
  .countdown-wrap{display:flex;align-items:center;gap:12px;margin-bottom:14px;min-height:40px;}
  .countdown-num{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--gold);min-width:2ch;text-align:right;line-height:1;transition:color .2s;}
  .countdown-num.urgent{color:var(--danger);animation:urgentPulse .4s ease-in-out infinite;}
  @keyframes urgentPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  .countdown-track{flex:1;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;}
  .countdown-fill{height:100%;background:var(--gold);border-radius:3px;width:100%;transition:background .3s;}
  .countdown-fill.urgent{background:var(--danger);}

  /* Bar */
  .bar-track{width:100%;height:60px;background:var(--green-mid);border:1px solid rgba(255,255,255,0.1);border-radius:12px;overflow:hidden;position:relative;cursor:pointer;margin-bottom:14px;user-select:none;touch-action:none;}
  .bar-track.active{border-color:var(--gold-border);box-shadow:0 0 16px rgba(242,180,0,0.15);}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--green-light),var(--gold));border-radius:10px;width:0%;position:relative;}
  .bar-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--white);border-radius:2px;box-shadow:0 0 8px rgba(255,255,255,0.6);}
  .bar-target-line{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);opacity:0;transition:opacity .3s;pointer-events:none;}
  .bar-target-line.show{opacity:.8;}

  .bar-instruction{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:16px;min-height:1.4em;}

  /* Attempt log */
  .attempt-log{margin-bottom:16px;}
  .attempt-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);margin-bottom:5px;font-size:13px;}
  .attempt-row .aname{font-weight:700;color:var(--white);}
  .attempt-row .ascore{font-family:'DM Mono',monospace;color:var(--muted);font-size:11px;}
  .attempt-row.good-row{border-color:rgba(76,175,122,0.4);}
  .attempt-row.ok-row{border-color:var(--gold-border);}
  .attempt-row.bad-row{border-color:rgba(224,82,82,0.3);}

  /* Result */
  .result-panel{display:none;background:var(--gold-dim);border:1px solid var(--gold-border);border-radius:10px;padding:16px 20px;margin-bottom:16px;text-align:center;}
  .result-panel.show{display:block;}
  .result-score{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--gold);letter-spacing:.05em;}
  .result-detail{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:4px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .15s;letter-spacing:.02em;width:100%;margin-bottom:10px;}
  .btn-primary{background:var(--gold);color:var(--green);}
  .btn-primary:hover{background:#ffc820;transform:translateY(-1px);box-shadow:0 4px 16px rgba(242,180,0,0.3);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold-border);}
  .btn-outline:hover{background:var(--gold-dim);}

  .form-section{margin-top:20px;border-top:1px solid rgba(255,255,255,0.08);padding-top:20px;}
  .form-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:8px;margin-top:14px;}
  .group-select{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:8px;}
  .group-btn{background:var(--gold-dim);border:1px solid var(--gold-border);color:var(--white);padding:8px 6px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center;}
  .group-btn:hover{background:rgba(242,180,0,0.28);border-color:var(--gold);}
  .group-btn.selected{background:var(--gold);color:var(--green);border-color:var(--gold);}
</style>
</head>
<body>
<div class="header">
  <div class="header-eyebrow">Corinda State High School</div>
  <h1>Fill the <span>Bar</span></h1>
  <div class="header-sub">5 rounds — one player per round — no peeking!</div>
</div>

<div class="card">
  <div class="player-banner" id="playerBanner">
    <span class="player-label">Player up</span>
    <input class="player-name-input" id="playerNameInput" type="text" aria-label="Student name" placeholder="Enter student name…" maxlength="30">
  </div>

  <div class="meta-row">
    <span class="round-badge" id="roundBadge">Round 1 of 5</span>
    <div class="round-track" id="roundTrack"></div>
  </div>

  <div class="target-area">
    <div class="target-label">Fill the bar to exactly</div>
    <div class="target-pct" id="targetPct">—</div>
  </div>

  <div class="countdown-wrap" id="countdownWrap" style="display:none">
    <div class="countdown-num" id="countdownNum">10</div>
    <div class="countdown-track"><div class="countdown-fill" id="countdownFill"></div></div>
  </div>

  <div class="bar-track" id="barTrack">
    <div class="bar-fill" id="barFill"></div>
    <div class="bar-target-line" id="targetLine"></div>
  </div>

  <div class="bar-instruction" id="barInstruction">Enter player name, then press Start</div>

  <div class="attempt-log" id="attemptLog" style="display:none"></div>

  <div class="result-panel" id="resultPanel">
    <div class="result-score" id="resultScore"></div>
    <div class="result-detail" id="resultDetail"></div>
  </div>

  <button class="btn btn-primary" id="lockBtn" onclick="lockIn()" disabled>Lock It In</button>
  <button class="btn btn-outline" onclick="resetAll()">Reset</button>
  <button class="btn btn-primary" id="startBtn" onclick="startGame()" style="margin-top:4px">Start</button>

  <div class="form-section" id="formSection" style="display:none">
    <span class="form-label">House</span>
    <div class="group-select" id="houseSelectBtns"></div>
    <span class="form-label">Home Group</span>
    <div class="group-select" id="groupSelectBtns"></div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitScore()" style="margin-top:16px" disabled>📤 Submit Score</button>
  </div>
</div>

<script src="../assets/site-config.js"></script>
<script>
// Opens the score form. Returns false if the browser blocked the new tab, in
// which case a real link is shown instead — clicking a link is never blocked.
function cshsOpenForm(url){
  var w=null;
  try{ w=window.open(url,'_blank'); }catch(e){ w=null; }
  var box=document.getElementById('cshsFormFallback');
  if(w){ if(box){ box.style.display='none'; } return true; }
  // Runs after the caller's own "submitted" messaging, so it can correct it.
  setTimeout(function(){
    var confirmEl=document.getElementById('submitConfirm');
    if(confirmEl){ confirmEl.style.display='none'; }
    var b=document.getElementById('cshsFormFallback');
    if(!b){
      b=document.createElement('div');
      b.id='cshsFormFallback';
      b.setAttribute('role','alert');
      b.style.cssText='margin:12px 0;padding:12px 14px;border:1px solid rgba(242,180,0,.5);'+
        'border-radius:10px;background:rgba(242,180,0,.12);text-align:center;';
      var msg=document.createElement('div');
      msg.style.cssText='font-size:13px;line-height:1.5;color:#fdfdfd;margin-bottom:9px;';
      msg.textContent='Your browser blocked the new tab, so the score form did not open. '+
        'Use this link instead — your score is already filled in.';
      var a=document.createElement('a');
      a.id='cshsFormFallbackLink';
      a.target='_blank'; a.rel='noopener';
      a.textContent='Open the score form';
      a.style.cssText='display:inline-block;padding:9px 18px;border-radius:8px;background:#f2b400;'+
        'color:#00180f;font-weight:700;font-size:14px;text-decoration:none;';
      b.appendChild(msg); b.appendChild(a);
      var anchor=document.getElementById('submitScoreBtn')||document.getElementById('submitBtn')||
                 document.querySelector('#score-form button');
      if(anchor&&anchor.parentNode){ anchor.parentNode.insertBefore(b,anchor.nextSibling); }
      else{ document.body.appendChild(b); }
    }
    document.getElementById('cshsFormFallbackLink').href=url;
    b.style.display='';
    try{ b.scrollIntoView({block:'nearest'}); }catch(e){}
  },0);
  return false;
}

  // 40-week bank — 5 rounds per week, times: 5,4,4,3,3
  const ROUND_BANK = [
    [{target:50,time:5},{target:33,time:4},{target:75,time:4},{target:20,time:3},{target:66,time:3}],
    [{target:40,time:5},{target:60,time:4},{target:25,time:4},{target:80,time:3},{target:45,time:3}],
    [{target:70,time:5},{target:15,time:4},{target:55,time:4},{target:85,time:3},{target:30,time:3}],
    [{target:35,time:5},{target:65,time:4},{target:10,time:4},{target:90,time:3},{target:50,time:3}],
    [{target:55,time:5},{target:25,time:4},{target:70,time:4},{target:40,time:3},{target:15,time:3}],
    [{target:80,time:5},{target:45,time:4},{target:20,time:4},{target:60,time:3},{target:35,time:3}],
    [{target:25,time:5},{target:75,time:4},{target:50,time:4},{target:10,time:3},{target:65,time:3}],
    [{target:60,time:5},{target:30,time:4},{target:85,time:4},{target:45,time:3},{target:20,time:3}],
    [{target:15,time:5},{target:55,time:4},{target:35,time:4},{target:70,time:3},{target:90,time:3}],
    [{target:45,time:5},{target:80,time:4},{target:15,time:4},{target:55,time:3},{target:30,time:3}],
    [{target:65,time:5},{target:20,time:4},{target:40,time:4},{target:75,time:3},{target:10,time:3}],
    [{target:30,time:5},{target:50,time:4},{target:90,time:4},{target:25,time:3},{target:60,time:3}],
    [{target:75,time:5},{target:10,time:4},{target:60,time:4},{target:35,time:3},{target:80,time:3}],
    [{target:20,time:5},{target:70,time:4},{target:45,time:4},{target:15,time:3},{target:55,time:3}],
    [{target:85,time:5},{target:40,time:4},{target:25,time:4},{target:65,time:3},{target:50,time:3}],
    [{target:50,time:5},{target:15,time:4},{target:80,time:4},{target:30,time:3},{target:70,time:3}],
    [{target:35,time:5},{target:60,time:4},{target:10,time:4},{target:85,time:3},{target:40,time:3}],
    [{target:70,time:5},{target:25,time:4},{target:55,time:4},{target:20,time:3},{target:75,time:3}],
    [{target:10,time:5},{target:45,time:4},{target:75,time:4},{target:50,time:3},{target:25,time:3}],
    [{target:90,time:5},{target:35,time:4},{target:20,time:4},{target:60,time:3},{target:15,time:3}],
    [{target:40,time:5},{target:65,time:4},{target:85,time:4},{target:10,time:3},{target:45,time:3}],
    [{target:55,time:5},{target:30,time:4},{target:50,time:4},{target:80,time:3},{target:20,time:3}],
    [{target:25,time:5},{target:75,time:4},{target:15,time:4},{target:40,time:3},{target:65,time:3}],
    [{target:80,time:5},{target:20,time:4},{target:60,time:4},{target:35,time:3},{target:90,time:3}],
    [{target:15,time:5},{target:50,time:4},{target:30,time:4},{target:70,time:3},{target:55,time:3}],
    [{target:60,time:5},{target:85,time:4},{target:45,time:4},{target:25,time:3},{target:10,time:3}],
    [{target:45,time:5},{target:10,time:4},{target:65,time:4},{target:50,time:3},{target:80,time:3}],
    [{target:20,time:5},{target:55,time:4},{target:35,time:4},{target:90,time:3},{target:30,time:3}],
    [{target:75,time:5},{target:40,time:4},{target:70,time:4},{target:15,time:3},{target:60,time:3}],
    [{target:30,time:5},{target:90,time:4},{target:25,time:4},{target:45,time:3},{target:85,time:3}],
    [{target:65,time:5},{target:15,time:4},{target:80,time:4},{target:55,time:3},{target:20,time:3}],
    [{target:10,time:5},{target:60,time:4},{target:50,time:4},{target:30,time:3},{target:75,time:3}],
    [{target:85,time:5},{target:35,time:4},{target:15,time:4},{target:65,time:3},{target:40,time:3}],
    [{target:50,time:5},{target:70,time:4},{target:40,time:4},{target:20,time:3},{target:55,time:3}],
    [{target:25,time:5},{target:45,time:4},{target:90,time:4},{target:75,time:3},{target:10,time:3}],
    [{target:70,time:5},{target:20,time:4},{target:55,time:4},{target:40,time:3},{target:85,time:3}],
    [{target:40,time:5},{target:80,time:4},{target:30,time:4},{target:10,time:3},{target:50,time:3}],
    [{target:15,time:5},{target:65,time:4},{target:85,time:4},{target:60,time:3},{target:35,time:3}],
    [{target:90,time:5},{target:25,time:4},{target:45,time:4},{target:80,time:3},{target:65,time:3}],
    [{target:55,time:5},{target:10,time:4},{target:70,time:4},{target:35,time:3},{target:20,time:3}],
  ];
  function getAbsWeek(){
    const terms = window.CSHS_SITE_CONFIG.terms;
    const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
    const mondayOf=d=>{const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x;};
    const today=new Date();today.setHours(0,0,0,0);
    let abs=1,chosen=1;
    for(const term of terms){const end=parse(term.end);let mon=mondayOf(parse(term.start));while(mon<=end){if(mon<=today)chosen=abs;else{return chosen;}mon=new Date(mon);mon.setDate(mon.getDate()+7);abs++;}}
    return chosen;
  }
  const ROUNDS = ROUND_BANK[(getAbsWeek()-1) % ROUND_BANK.length];
  const HOUSES=['Bunar','Dibbil','Kabul','Moori','Pirri','Yarraman'];
  const GROUPS=['A','B','C','D','E','F','G','H','I','J','K','L','M','N','Staff'];
  let round=0,roundScores=[],currentFill=0,dragging=false,active=false,countdownInterval=null,roundTime=10;
  let selectedHouse=null,selectedGroup=null;

  const barTrack=document.getElementById('barTrack'),barFill=document.getElementById('barFill'),targetLine=document.getElementById('targetLine');
  const targetPct=document.getElementById('targetPct'),barInstruction=document.getElementById('barInstruction');
  const lockBtn=document.getElementById('lockBtn'),startBtn=document.getElementById('startBtn');
  const resultPanel=document.getElementById('resultPanel'),resultScore=document.getElementById('resultScore'),resultDetail=document.getElementById('resultDetail');
  const formSection=document.getElementById('formSection'),submitBtn=document.getElementById('submitBtn');
  const countdownWrap=document.getElementById('countdownWrap'),countdownNum=document.getElementById('countdownNum'),countdownFill=document.getElementById('countdownFill');
  const attemptLog=document.getElementById('attemptLog'),playerInput=document.getElementById('playerNameInput');

  ROUNDS.forEach((_,i)=>{const p=document.createElement('div');p.className='rpip';p.id='rpip'+i;document.getElementById('roundTrack').appendChild(p);});

  function getX(e){const r=barTrack.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX;return Math.max(0,Math.min(1,(cx-r.left)/r.width));}
  function setFill(f){currentFill=f*100;barFill.style.width=currentFill+'%';}
  barTrack.addEventListener('mousedown',e=>{if(!active)return;dragging=true;setFill(getX(e));});
  barTrack.addEventListener('mousemove',e=>{if(!dragging)return;setFill(getX(e));});
  document.addEventListener('mouseup',()=>{dragging=false;});
  barTrack.addEventListener('touchstart',e=>{if(!active)return;e.preventDefault();dragging=true;setFill(getX(e));},{passive:false});
  barTrack.addEventListener('touchmove',e=>{if(!dragging)return;e.preventDefault();setFill(getX(e));},{passive:false});
  document.addEventListener('touchend',()=>{dragging=false;});

  function startGame(){
    if(!playerInput.value.trim()){playerInput.focus();playerInput.style.borderColor='var(--danger)';return;}
    playerInput.style.borderColor='';startBtn.style.display='none';loadRound();
  }

  function loadRound(){
    const cfg=ROUNDS[round];roundTime=cfg.time;
    targetPct.textContent=cfg.target+'%';
    document.getElementById('roundBadge').textContent=`Round ${round+1} of ${ROUNDS.length}`;
    barFill.style.width='0%';currentFill=0;active=true;
    barTrack.classList.add('active');targetLine.classList.remove('show');
    lockBtn.disabled=false;resultPanel.classList.remove('show');
    barInstruction.textContent=`${playerInput.value.trim()} — drag to fill · class calls the stop! (${cfg.time}s)`;
    playerInput.disabled=true;

    countdownWrap.style.display='flex';countdownNum.textContent=roundTime;
    countdownNum.classList.remove('urgent');countdownFill.style.width='100%';countdownFill.classList.remove('urgent');
    const start=performance.now();clearInterval(countdownInterval);
    countdownInterval=setInterval(()=>{
      const rem=Math.max(0,roundTime-(performance.now()-start)/1000),frac=rem/roundTime;
      countdownNum.textContent=Math.ceil(rem);countdownFill.style.width=(frac*100)+'%';
      const u=rem<=3;countdownNum.classList.toggle('urgent',u);countdownFill.classList.toggle('urgent',u);
      if(rem<=0){clearInterval(countdownInterval);if(active)lockIn();}
    },50);
  }

  function lockIn(){
    if(!active)return;clearInterval(countdownInterval);active=false;dragging=false;
    barTrack.classList.remove('active');lockBtn.disabled=true;countdownWrap.style.display='none';
    const cfg=ROUNDS[round],diff=Math.abs(currentFill-cfg.target),score=Math.max(0,Math.round(100-diff*4));
    const name=playerInput.value.trim();
    roundScores.push({fill:currentFill.toFixed(1),target:cfg.target,diff:diff.toFixed(1),score,name});
    targetLine.style.left=cfg.target+'%';targetLine.classList.add('show');
    document.getElementById('rpip'+round).classList.add('done');updateLog();
    const quality=diff<3?'good':diff<8?'ok':'bad';
    resultPanel.classList.add('show');resultPanel.className='result-panel show';
    resultScore.textContent=diff<3?'🎯 Spot on!':diff<8?'Close!':'Keep going!';
    resultDetail.textContent=`${name} filled ${currentFill.toFixed(1)}%, target ${cfg.target}% (off ${diff.toFixed(1)}%)`;
    round++;
    if(round<ROUNDS.length){
      barInstruction.textContent=`Next player up! — only ${ROUNDS[round].time}s this round`;
      startBtn.textContent=`Start Round ${round+1}`;startBtn.style.display='';
      playerInput.value='';playerInput.disabled=false;playerInput.focus();
    } else {
      barInstruction.textContent='All done!';showFinal();
    }
  }

  function updateLog(){
    attemptLog.style.display='block';
    attemptLog.innerHTML=roundScores.map((r,i)=>{
      const d=parseFloat(r.diff),cls=d<3?'good-row':d<8?'ok-row':'bad-row';
      return `<div class="attempt-row ${cls}"><span class="aname">R${i+1} — ${r.name}</span><span class="ascore">${r.fill}% · target ${r.target}% · off ${r.diff}%</span></div>`;
    }).join('');
  }

  function showFinal(){
    const total=roundScores.reduce((s,r)=>s+r.score,0),finalScore=Math.round(total/50);
    resultScore.textContent='Score: '+finalScore+' / 10';
    resultDetail.textContent=roundScores.map((r,i)=>`R${i+1} ${r.name}: off ${r.diff}%`).join(' · ');
    document.getElementById('playerBanner').style.opacity='0.5';
    formSection.style.display='block';buildSelectors();
  }

  function buildSelectors(){
    document.getElementById('houseSelectBtns').innerHTML=HOUSES.map(h=>`<button class="group-btn" onclick="selectHouse('${h}')">${h}</button>`).join('');
    document.getElementById('groupSelectBtns').innerHTML=GROUPS.map(g=>`<button class="group-btn" onclick="selectGroup('${g}')">${g}</button>`).join('');
  }
  function selectHouse(h){selectedHouse=h;document.querySelectorAll('#houseSelectBtns .group-btn').forEach(b=>b.classList.toggle('selected',b.textContent===h));checkForm();}
  function selectGroup(g){selectedGroup=g;document.querySelectorAll('#groupSelectBtns .group-btn').forEach(b=>b.classList.toggle('selected',b.textContent===g));checkForm();}
  function checkForm(){submitBtn.disabled=!(selectedHouse&&selectedGroup);}

  function getCurrentWeek(){
    const terms = window.CSHS_SITE_CONFIG.terms;
    const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
    const mondayOf=d=>{const x=new Date(d);const dow=(x.getDay()+6)%7;x.setDate(x.getDate()-dow);x.setHours(0,0,0,0);return x;};
    const today=new Date();today.setHours(0,0,0,0);
    let chosen={t:1,w:1};
    for(const term of terms){const end=parse(term.end);let mon=mondayOf(parse(term.start));let w=1;while(mon<=end){if(mon<=today)chosen={t:term.t,w};else return `Term ${chosen.t} · Week ${chosen.w}`;mon=new Date(mon);mon.setDate(mon.getDate()+7);w++;}}
    return `Term ${chosen.t} · Week ${chosen.w}`;
  }
  const CSHS_FORM_BASE='https://forms.cloud.microsoft/Pages/ResponsePage.aspx';
  const CSHS_FORM_ID='xccAZrUWr0uekzI72MAduqpmcw_jVYVCjN05AfEP1IdUOUtFVUJQOFhZWjRZNjAzRkMyWlozTUpTUy4u';
  const CSHS_F_WEEK='rb28fecc633264af694f45d8cf2b3b8c1',CSHS_F_GAME='rdbbd457b83da425e93f978536b950482';
  const CSHS_F_HOUSE='rd04d4cf9da8a4213820791f91cdcf6ba',CSHS_F_GROUP='r3022db1950b649218496e706728c203f';
  const CSHS_F_SCORE='r8b61653d0854482a9e7e329026083f7b';

  function submitScore(){
    const total=roundScores.reduce((s,r)=>s+r.score,0),finalScore=Math.round(total/50);
    const params=new URLSearchParams({id:CSHS_FORM_ID,[CSHS_F_WEEK]:getCurrentWeek(),[CSHS_F_GAME]:'Fill the Bar',[CSHS_F_HOUSE]:selectedHouse,[CSHS_F_GROUP]:(selectedGroup==='Staff'?'Staff':selectedHouse+' '+selectedGroup),[CSHS_F_SCORE]:String(finalScore)});
    cshsOpenForm(CSHS_FORM_BASE+'?'+params.toString());
    submitBtn.textContent='↗ Reopen form';submitBtn.disabled=false;
  }

  function resetAll(){
    clearInterval(countdownInterval);round=0;roundScores=[];currentFill=0;active=false;dragging=false;selectedHouse=null;selectedGroup=null;
    barFill.style.width='0%';targetPct.textContent='—';targetLine.classList.remove('show');barTrack.classList.remove('active');
    barInstruction.textContent='Enter player name, then press Start';lockBtn.disabled=true;
    resultPanel.classList.remove('show');countdownWrap.style.display='none';
    startBtn.textContent='Start';startBtn.style.display='';
    attemptLog.style.display='none';attemptLog.innerHTML='';formSection.style.display='none';
    submitBtn.textContent='📤 Submit Score';submitBtn.disabled=true;
    document.getElementById('roundBadge').textContent='Round 1 of 5';
    document.getElementById('playerBanner').style.opacity='';
    playerInput.value='';playerInput.disabled=false;playerInput.style.borderColor='';
    ROUNDS.forEach((_,i)=>{document.getElementById('rpip'+i).className='rpip';});
  }
</script>
</body>
</html>
